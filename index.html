<!DOCTYPE html>

<!-- Joseph Green 09/07/26 -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pet Gallery</title>

    <script src="cardCreator.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #1d4279;
            color: white;
        }

        #PetImage {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px #0000004d;
        }

        .galleryContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }

        .petDetails {
            display: grid;
            grid-template-columns: auto auto;
            gap: 0.75rem 1rem;
            justify-content: center;
        }

        .petDetails dt {
            font-weight: bold;
            text-align: right;
        }

        .petDetails dd {
            margin: 0;
            text-align: left;
        }

        #galleryHeading,
        .buttons {
            text-align: center;
            margin-top: 1.5rem;
        }
    </style>
</head>

<body>

    <h1 id="galleryHeading">Pet Gallery</h1>

    <div class="galleryContainer">

        <img id="PetImage" src="" alt="Pet image">

        <dl class="petDetails">

            <dt>Name:</dt>
            <dd id="petName"></dd>

            <dt>Details:</dt>
            <dd id="petDetails"></dd>

            <dt>Owner:</dt>
            <dd id="petOwner"></dd>

            <dt>Owner Phone:</dt>
            <dd id="ownerPhone"></dd>

            <dt>ID:</dt>
            <dd id="petID"></dd>

        </dl>

    </div>

    <div class="buttons">
        <button id="prev">Previous</button>
        <button id="next">Next</button>
    </div>

</body>

</html>
