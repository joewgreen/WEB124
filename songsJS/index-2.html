<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>4-Song Playlist Manager</title>
  <link rel="stylesheet" href="style-1.css">
  <script src="songs.js" defer></script>
</head>
<body>

  <main>
    <h2>My Favorite Songs</h2>

    <section class="inputGroup">
      <input type="text" id="songTitle" placeholder="Song Title">
      <input type="text" id="songArtist" placeholder="Artist">
      <button type="button" id="addBtn">Add Song</button>
    </section>

    <section id="playlistContainer">

      <article class="songCard">
        <span>Song For the Dead by Queens Of the Stone Age</span>
        <button class="deleteBtn">Delete</button>
      </article>
      <article class="songCard">
        <span>Deep Blue Day by Brian Eno</span>
        <button class="deleteBtn">Delete</button>
      </article>
      <article class="songCard">
        <span>Fare Thee Well, Miss Carousel by Townes Van Zandt</span>
        <button class="deleteBtn">Delete</button>
      </article>
      <article class="songCard">
        <span>Melody by Fishmans</span>
        <button class="deleteBtn">Delete</button>
      </article>

    </section>
  </main>

</body>
</html>
